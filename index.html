  <body>
    <seelenstimme-app></seelenstimme-app>

    <!-- Note: not dead markup — Netlify only detects forms it can parse at build time, and the real
         form is inside a shadow root. Keep in sync with the contact form; see README "The contact form". -->
    <form name="contact" method="post" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="first-name" />
      <input type="text" name="last-name" />
      <input type="email" name="email" />
      <input type="tel" name="phone-number" />
      <input type="text" name="address" />
      <input type="text" name="service" />
      <input type="text" name="duration" />
      <input type="text" name="preis" />
      <input type="text" name="zirkel-level" />
      <textarea name="message"></textarea>
      <input type="text" name="datenschutz-zustimmung" />
      <input type="text" name="sprache" />
      <input type="text" name="subject" />
    </form>
  </body>
